<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eDu Live – You're Offline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: linear-gradient(135deg, #fff1f1 0%, #fff 60%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1f2937;
      }
      .container {
        text-align: center;
        padding: 40px 24px;
        max-width: 480px;
      }
      .icon {
        font-size: 72px;
        margin-bottom: 24px;
        display: block;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 12px;
      }
      p {
        font-size: 16px;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #dc2626, #e11d48);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 28px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(220, 38, 38, 0.3);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(220, 38, 38, 0.4);
      }
      .badge {
        display: inline-block;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        font-size: 13px;
        font-weight: 600;
        padding: 6px 16px;
        border-radius: 100px;
        margin-bottom: 24px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="icon">📶</span>
      <div class="badge">No Internet Connection</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Check your network
        settings and try again. Some cached content may still be available.
      </p>
      <a class="btn" href="/" onclick="window.location.reload()">
        🔄 Try Again
      </a>
    </div>
  </body>
</html>
